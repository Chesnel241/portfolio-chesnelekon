<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" width="800" height="400">
  <rect width="800" height="400" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#0f172a" rx="12"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#eab308"/>
  <circle cx="56" cy="21" r="5" fill="#22c55e"/>
  <text x="80" y="26" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="600">ISO/SAE 21434 TARA Threat Analysis Matrix — Keyless Entry ECU</text>

  <!-- Table Header -->
  <rect x="40" y="60" width="720" height="35" fill="#1e293b" rx="4"/>
  <text x="55" y="82" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Threat Scenario ID</text>
  <text x="210" y="82" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Asset / Property</text>
  <text x="380" y="82" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Impact</text>
  <text x="490" y="82" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Feasibility</text>
  <text x="630" y="82" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Risk Level</text>

  <!-- Row 1 -->
  <rect x="40" y="105" width="720" height="55" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="55" y="137" fill="#f87171" font-family="monospace" font-size="12" font-weight="600">TS_KEYLESS_01</text>
  <text x="210" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="12">Relay Attack on LF/RF</text>
  <text x="210" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11">Authenticity &amp; Integrity</text>
  <text x="380" y="137" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">SEVERE (3)</text>
  <text x="490" y="137" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">MEDIUM (2)</text>
  <rect x="630" y="120" width="100" height="26" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" rx="4"/>
  <text x="648" y="137" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">HIGH (R4)</text>

  <!-- Row 2 -->
  <rect x="40" y="170" width="720" height="55" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="55" y="202" fill="#f87171" font-family="monospace" font-size="12" font-weight="600">TS_KEYLESS_02</text>
  <text x="210" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="12">CAN Frame Injection</text>
  <text x="210" y="213" fill="#94a3b8" font-family="sans-serif" font-size="11">Door Unlock Command</text>
  <text x="380" y="202" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">MAJOR (3)</text>
  <text x="490" y="202" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">HIGH (3)</text>
  <rect x="630" y="185" width="100" height="26" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" rx="4"/>
  <text x="644" y="202" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">CRITICAL</text>

  <!-- Row 3 -->
  <rect x="40" y="235" width="720" height="55" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="55" y="267" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">TS_KEYLESS_03</text>
  <text x="210" y="260" fill="#e2e8f0" font-family="sans-serif" font-size="12">Key Counter Desync</text>
  <text x="210" y="278" fill="#94a3b8" font-family="sans-serif" font-size="11">Availability</text>
  <text x="380" y="267" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">MODERATE (2)</text>
  <text x="490" y="267" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">LOW (1)</text>
  <rect x="630" y="250" width="100" height="26" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" rx="4"/>
  <text x="650" y="267" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">LOW (R1)</text>

  <!-- Bottom cybersecurity goal statement -->
  <rect x="40" y="305" width="720" height="70" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-dasharray="3 3" rx="6"/>
  <text x="55" y="332" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Cybersecurity Goal (CG_01):</text>
  <text x="55" y="355" fill="#cbd5e1" font-family="sans-serif" font-size="12">"The Keyless Entry System shall enforce distance-bounding and encrypted rolling counters to prevent relay and replay attacks."</text>
</svg>
