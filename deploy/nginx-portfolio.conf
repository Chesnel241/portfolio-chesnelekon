# Nginx Configuration pour Portfolio (Astro Statique)
# Emplacement recommandé sur le VPS : /etc/nginx/sites-available/portfolio
# Activation : sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# Test syntaxe : sudo nginx -t && sudo systemctl reload nginx

# Zone de Rate Limiting (à placer dans /etc/nginx/nginx.conf dans le bloc http{} si nécessaire, 
# ou gérée au niveau global) :
# limit_req_zone $binary_remote_addr zone=portfolio_rate:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ton-domaine.fr www.ton-domaine.fr;

    # Emplacement du site statique généré par `npm run build`
    root /var/www/portfolio/dist;
    index index.html;

    # Limite de débit globale contre les attaques par déni de service / scraping
    # limit_req zone=portfolio_rate burst=30 nodelay;

    # --- EN-TÊTES DE SÉCURITÉ RENFORCÉS (HARDENING) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (CSP) adaptée pour Astro, Google Fonts & SimpleIcons
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.simpleicons.org; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;

    # --- OPTIMISATION COMPRESSION GZIP ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Routage statique principal Astro
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache agressif et immuable sur les assets compilés (fingerprintés) d'Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache sur les médias statiques (images, favicons, pdfs)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|pdf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Interdiction d'accès aux fichiers cachés (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gestion personnalisée des erreurs 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
